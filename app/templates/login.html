<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هستما</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/login-style.css') }}">
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="brand">
                <img src="{{ url_for('static', path='images/samanehlogo.png') }}" alt="لوگوی هستما">
                <div>
                    <h1>سامانه هستما</h1>
                    <p>ورود به محیط کاربری</p>
                </div>
            </div>

            <div class="login-header">
                <h2>خوش آمدید</h2>
                <p>برای دسترسی به داشبورد اطلاعات خود را وارد کنید.</p>
            </div>

            <form class="login-form" onsubmit="event.preventDefault(); login();">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required autocomplete="username">
                        <label for="username">نام کاربری</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <label for="password">رمز عبور</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-footer">
                    <label class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">
                            <span class="checkmark"></span>
                            مرا به خاطر بسپار
                        </span>
                    </label>
                    <a href="#" class="forgot-password">فراموشی رمز عبور؟</a>
                </div>

                <button type="submit" class="btn">ورود</button>
            </form>

            <p class="login-note">برای دریافت اطلاعات ورود با واحد پشتیبانی تماس بگیرید.</p>
        </div>
    </div>

    <footer class="login-footer">
        محصولی از شرکت هنر افزار ایرانیان - نسخه آزمایشی
    </footer>

    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>

</html>
