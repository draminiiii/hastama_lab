name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            gnupg \
            unixodbc \
            unixodbc-dev \
            wkhtmltopdf

      - name: Add Microsoft package repository
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | \
            gpg --dearmor --batch --yes -o microsoft-prod.gpg

          sudo install -o root -g root -m 644 \
            microsoft-prod.gpg \
            /usr/share/keyrings/microsoft-prod.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | \
            sudo tee /etc/apt/sources.list.d/mssql-release.list

          rm -f microsoft-prod.gpg

      - name: Install Microsoft ODBC Driver 17
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: Verify ODBC Driver
        run: |
          echo "ODBC configuration:"
          odbcinst -j

          echo "Installed ODBC drivers:"
          odbcinst -q -d

          echo "Checking SQL Server ODBC Driver 17:"
          odbcinst -q -d | grep -F "ODBC Driver 17 for SQL Server"

      - name: Create environment file
        run: |
          touch .env

      - name: Install dependencies
        run: |
          make install

      - name: Test with pytest
        run: |
          make test
